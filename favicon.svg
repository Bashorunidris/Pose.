<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Main camera body with notch at top -->
  <g>
    <!-- Bottom rounded rectangle -->
    <rect x="20" y="50" width="160" height="130" rx="25" fill="#6B3FE0"/>
    
    <!-- Top notch section -->
    <path d="M 60 50 L 70 20 Q 100 10 130 20 L 140 50 Z" fill="#6B3FE0"/>
    
    <!-- Top curve connecting notch -->
    <path d="M 60 50 Q 50 40 50 50 L 50 70" fill="#6B3FE0"/>
    <path d="M 140 50 Q 150 40 150 50 L 150 70" fill="#6B3FE0"/>
  </g>
  
  <!-- Outer white lens ring -->
  <circle cx="100" cy="105" r="45" fill="none" stroke="white" stroke-width="16"/>
  
  <!-- Inner purple lens circle -->
  <circle cx="100" cy="105" r="22" fill="#6B3FE0"/>
  
  <!-- Flash light (optional small detail) -->
  <rect x="130" y="35" width="12" height="12" rx="2" fill="white" opacity="0.5"/>
</svg>
